spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/budget
    username: budget
    password: budget
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      audio:
        transcription:
          options:
            model: whisper-1
        speech:
          options:
            model: tts-1
            voice: alloy
